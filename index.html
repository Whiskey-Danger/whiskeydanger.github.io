<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whiskey Danger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cooper Black', 'Arial Black', sans-serif;
            background: #F7F2E6;
            color: #1E1E1E;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 40px;
            animation: fadeInDown 1s ease-out;
        }

        .logo {
            max-width: 500px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 8px 0px rgba(0, 0, 0, 0.15));
        }

        .tagline {
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 50px;
            color: #D88B2D;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: fadeInUp 1s ease-out 0.3s backwards;
        }

        .cta-button {
            display: inline-block;
            padding: 20px 60px;
            font-size: 1.3rem;
            font-weight: 900;
            color: #F7F2E6;
            background: #E24E46;
            text-decoration: none;
            border-radius: 60px;
            border: 5px solid #1E1E1E;
            transition: all 0.2s ease;
            box-shadow: 0 8px 0 #1E1E1E;
            animation: fadeInUp 1s ease-out 0.6s backwards;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
        }

        .cta-button:hover {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #1E1E1E;
        }

        .cta-button:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #1E1E1E;
        }

        .work {
            margin-top: 64px;
            animation: fadeInUp 1s ease-out 0.9s backwards;
        }

        .work-label {
            font-size: 0.95rem;
            opacity: 0.55;
            margin-bottom: 14px;
        }

        .work-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
        }

        .work-item {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 8px 20px 8px 8px;
            color: #1E1E1E;
            text-decoration: none;
            text-align: left;
            background: #FFFBEF;
            border: 3px solid #1E1E1E;
            border-radius: 18px;
            box-shadow: 0 4px 0 #1E1E1E;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .work-item:hover {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1E1E1E;
        }

        .work-item:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #1E1E1E;
        }

        .work-item:focus-visible,
        .cta-button:focus-visible {
            outline: 3px solid #D88B2D;
            outline-offset: 4px;
        }

        .work-item img {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            border: 2.5px solid #1E1E1E;
            background: #007AFF;
        }

        .work-item b {
            display: block;
            font-size: 1.1rem;
            font-weight: 400;
        }

        .work-item small {
            display: block;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 0.85rem;
            opacity: 0.7;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .logo {
                max-width: 300px;
            }

            .tagline {
                font-size: 1.2rem;
            }

            .cta-button {
                padding: 15px 40px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="whiskey-danger-logo.png" alt="Whiskey Danger" class="logo">
        </div>

        <a href="mailto:howdy@whiskeydanger.com" class="cta-button">Howdy, Partner - Let's Chat!</a>

        <section class="work" aria-labelledby="work-label">
            <p class="work-label" id="work-label">Things we've made</p>
            <ul class="work-list">
                <li>
                    <a class="work-item" href="/pacachat/">
                        <img src="/pacachat/assets/paca-mark.png" alt="">
                        <span><b>Pacachat</b><small>Private AI chat for iPhone and iPad</small></span>
                    </a>
                </li>
            </ul>
        </section>
    </div>
</body>
</html>
